[pytest]
# Run all tests in the tests/ directory and subdirectories.
# Look for test_*.py files and test_* functions/classes.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Enable verbose output with full diffs on failure.
# -v: verbose, show each test name
# -ra: show summary of all test outcomes except passed
# --tb=short: concise tracebacks
addopts = -v -ra --tb=short

# Show local variables in tracebacks for debugging.
showlocals = true

# Minimum Python version required to run tests.
minversion = 3.8

# Markers for categorizing tests (use @pytest.mark.<name>).
markers =
    integration: tests that require a running server or network (deselect with '-m "not integration"')
    slow: tests that take noticeable time (deselect with '-m "not slow"')
