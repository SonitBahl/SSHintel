name: Tests

# Run on pushes to any branch and on pull requests.
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # Test against supported Python versions.
    # Paramiko 3.4 supports Python 3.8+; we test 3.8, 3.10, 3.12.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10', '3.12']

    steps:
      # Step 1: Check out the repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up the Python version.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Step 3: Install runtime dependencies.
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Install test dependencies.
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # Step 5: Run the full test suite with coverage.
      - name: Run tests
        run: pytest

      # Step 6: Generate coverage report (informational, does not fail the build).
      - name: Coverage report
        run: pytest --cov --cov-report=term-missing --cov-fail-under=0
